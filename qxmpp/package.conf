# qxmpp, the XMPP library of Azoth's Xoox plugin, for the distros that ship one older than Xoox needs. The floor
# mirrors src/plugins/azoth/plugins/xoox/CMakeLists.txt in the LeechCraft repository.
floor=1.16.0
debian_dev_package=libqxmppqt6-dev
fedora_dev_package=qxmpp-qt6-devel

tarball_url()
{
	echo "https://invent.kde.org/libraries/qxmpp/-/archive/v$1/qxmpp-v$1.tar.gz"
}
